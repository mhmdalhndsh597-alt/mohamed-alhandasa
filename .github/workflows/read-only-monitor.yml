name: Read-only liquidity monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: read-only-liquidity-monitor
  cancel-in-progress: false

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: python -m unittest -v
      - run: ruff check .
      - run: bandit -r . -x ./.git
      - run: pip-audit
      - run: pip-audit -r requirements-dashboard.txt

  monitor:
    needs: security
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run read-only monitor with RPC fallback
        env:
          RPC_URL: ${{ secrets.RPC_URL }}
          RPC_URLS: ${{ secrets.RPC_URLS }}
          CHAIN_ID: ${{ vars.CHAIN_ID || '1' }}
          WATCH_ADDRESSES: ${{ vars.WATCH_ADDRESSES || '' }}
          CONTRACT_ADDRESSES: ${{ vars.CONTRACT_ADDRESSES || '' }}
          WHALE_THRESHOLD_NATIVE: ${{ vars.WHALE_THRESHOLD_NATIVE || '100' }}
          SPIKE_THRESHOLD_PERCENT: ${{ vars.SPIKE_THRESHOLD_PERCENT || '50' }}
          EXPLORER_TX_URL: ${{ vars.EXPLORER_TX_URL || 'https://etherscan.io/tx/{tx_hash}' }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          SOCIAL_WEBHOOKS: ${{ secrets.SOCIAL_WEBHOOKS }}
          STATE_FILE: data/volume_history.jsonl
          LOG_LEVEL: INFO
        run: python monitor.py
      - name: Generate daily and weekly reports
        env:
          STATE_FILE: data/volume_history.jsonl
          REPORT_DIR: reports
        run: python report.py
      - name: Upload monitoring evidence
        uses: actions/upload-artifact@v4
        with:
          name: liquidity-monitor-${{ github.run_number }}
          path: |
            reports/
            data/volume_history.jsonl
          if-no-files-found: warn
          retention-days: 14
