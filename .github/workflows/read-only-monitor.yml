name: Read-only liquidity monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: read-only-liquidity-monitor
  cancel-in-progress: false

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: python -m unittest -v
      - run: ruff check .
      - run: bandit -r . -x ./.git
      - run: pip-audit

  monitor:
    needs: security
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run read-only monitor
        env:
          RPC_URL: ${{ secrets.RPC_URL }}
          CHAIN_ID: ${{ vars.CHAIN_ID }}
          WATCH_ADDRESSES: ${{ vars.WATCH_ADDRESSES }}
          CONTRACT_ADDRESSES: ${{ vars.CONTRACT_ADDRESSES }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python monitor.py
